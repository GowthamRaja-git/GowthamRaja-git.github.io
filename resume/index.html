<!DOCTYPE html>
<html lang="en">
<head>
  <title>Gowtham's Resume</title>
  <link rel="icon" href="favicon.ico">

  <style>
    body {
      background-color: #f2f2f2;   /* light background */
      margin: 0;
      padding: 30px 0;
      font-family: Arial, sans-serif;
    }

    .resume-container {
      display: flex;
      justify-content: center;     /* center horizontally */
    }

    .resume {
      background: white;
      padding: 20px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2); /* resume look */
    }

    .resume img {
      width: 800px;                /* resume width */
      height: auto;
      display: block;
    }
  </style>
</head>

<body>
  <div class="resume-container">
    <div class="resume">
      <img src="resume.jpg" alt="Resume">
    </div>
  </div>
</body>
</html>
