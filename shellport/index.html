<html>
	<head>
		<title> CommandLine CV </title>
		<link href="stylesheets/styles.css" type="text/css" rel="stylesheet">
                <link rel="icon" href="favicon.ico">
		
	</head>
	<script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
	<script>
		$(document).ready(function() {
			var curCount = 0;
					   
			//var myVar=setInterval(function(){blinkTimer()},500);

			function blinkTimer()
			{		
				var body = $("#command").html(); 
				
				if(body.substring(body.length-1, body.length) == "|")	
				{
					$("#command").html($("#command").html().substring(0, body.length-1)); // remove it
					$("#command").append(" ");
				}
				else
				{
					if(body.substring(body.length-1, body.length) == " ")
					{
						$("#command").html($("#command").html().substring(0, body.length-1)); // remove it
					}
					$("#command").append("|"); // else write it
				}	
			}
		});
				
		var Count = 1;
		var outCount = 0;
		function myFunction()
		{
			if(event.which == 13)
			{
				var addCode;
				event.preventDefault();
				var command = document.getElementById("input" + Count).value;
				if("whoami" == command)
				{
					outCount++;
					$("#terminal").append('<span id = "output'+ outCount +'"> Hi, <font color = "#0f0">I\'m Gowtham </font><br>\
							2024 - Computer Science Engineering Graduate | Backend Developer | <br>\
							Building scalable Enterprise Applications. </span><br id = "out'+ outCount +'">');
				}
				else if("ls" == command)
				{
					outCount++;
					$("#terminal").append('<span id = "output'+ outCount +'"> \
							<a href="https://github.com/GowthamRaja-git" target="_blank">GitHub</a>\
							<a href="https://www.linkedin.com/in/gowtham-rajasekaran-21a56624a/" target="_blank">LinkedIn</a>\
							<a href="https://gowthamraja-git.github.io/Portfolio/" target="_blank">Portfolio</a>\
							<a href="https://leetcode.com/u/gowthamvim/" target="_blank">Leetcode</a>\
							<a href="https://www.naukri.com/code360/profile/Gowthamvim" target="_blank">Code360</a>\
							</span><br id = "out'+ outCount +'">');
				}

				else if("workexp" == command)
				{
					outCount++;
					$("#terminal").append('<span id="output' + outCount + '">' +
                      'Im a .NET Backend Developer with 1.6 years of hands-on industry experience<br>' +
                      'Built REST APIs, Enterprise Applications, and scalable backend systems<br>' +
                      'Worked with .NET Core, ASP.NET MVC, .NET FRAMEWORK 4.8, REST APIs, C#, HTML5, CSS3, JavaScript, Python, Flask, SQL Server' +
					  '</span><br id="out' + outCount + '">'
					);
				}

				else if (command === "skills") {
    outCount++;
    $("#terminal").append(`
        <span id="output${outCount}">
            <span style="color:#0f0">TECHNICAL SKILLS</span><br>

            LANGUAGES:<br>
            &nbsp;C# (.NET) • Angular • Java (Spring Boot) • C++ • Python • Data Structures & Algorithms<br>

            TECHNOLOGIES:<br>
            &nbsp;.NET • ASP.NET MVC • MySQL • LINQ<br>

            CONCEPTS:<br>
            &nbsp;Object-Oriented Programming • REST API • Design Patterns<br>

            TOOLS:<br>
            &nbsp;Fork • Git • Swagger • Postman • Vim • GitHub Copilot • Claude • AI Prompting
        </span>
        <br id="out${outCount}">
    `);
}


				else if("clear" == command)
				{
					for (i = 1; i <= Count; i++) 
					{ 
						document.getElementById("command" + i).parentNode.removeChild(document.getElementById("command" + i));
						document.getElementById("input" + i).parentNode.removeChild(document.getElementById("input" + i));
						document.getElementById(i).parentNode.removeChild(document.getElementById(i));
					}
					for(i = 1; i <= outCount; i++)
					{
						document.getElementById("output" + i).parentNode.removeChild(document.getElementById("output" + i));
						document.getElementById("out" + i).parentNode.removeChild(document.getElementById("out" + i));
					}
					Count = 0;
					outCount = 0;
				}
				$("#input" + Count).val('');
				$("#command" + Count).append( ' ' + command);
				
				Count++;
				addCode = '<span id = "command'+ Count + '">\
					{<span id="user">gowtham@vim</span>:<span id = "s1">~</span>}</span>\
					<input id = "input'+ Count +'" type="text" onkeydown="myFunction()"><br id = "' + Count + '">';
				$("#terminal").append(addCode);
				$("#input" + Count).focus();
			}
		}
	</script>

	<body>
		<div class="putty" id = "terminal">
		<span style="color:#0f0">Gowtham Rajasekaran</span><br></br>
		
		Designation: Software Engineer <br>
		Experience: 1.6 Years <br><br>
		
		
		Type in Linux commands to know more about me <br><br>
		
		ls - List Directory<br>
		clear - Clear Terminal<br>
		whoami - More Info about me<br>
		workexp - My Work Experience<br>
		skills - My Skills <br><br>
		
		<span id = "command1">{<span id="user">gowtham@vim</span>:<span id = "s1">~</span>}</span>
		<input id= "input1" type="text" onkeydown="myFunction()" autofocus >
		<br id = "1">
		</div>
	</body>
</html>
